<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Junnu ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">

        <div class="purple-glow glow-1"></div>
        <div class="purple-glow glow-2"></div>
        <div class="purple-glow glow-3"></div>

        <div class="stars"></div>

    </div>


    <!-- Main Landing Screen -->
    <main class="landing-screen">

        <div class="landing-content">

            <p class="tiny-title">
                A TINY SURPRISE, MADE WITH LOVE
            </p>


            <div class="name-area">

                <h1 class="name">
                    Junnu
                </h1>

                <div class="heart">
                    ❤️
                </div>

            </div>


            <p class="subtitle">
                একটা ছোট্ট উপহার... শুধু তোমার জন্য।
            </p>


            <button class="open-button" id="openGift">

                <span class="button-heart">♡</span>

                <span>Open Your Gift</span>

            </button>


            <p class="hint">
                একবার চাপ দাও...
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
